<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="The Little Dynasty Games — independent mobile games and the home of Next Brainrot: Evolution.">
  <meta name="theme-color" content="#101724">
  <title>The Little Dynasty Games</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #f5f7fc;
      background: #101724;
      font-synthesis: none;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      background: radial-gradient(ellipse at 50% 0%, #23344d 0%, transparent 65%);
    }
    main { width: 100%; max-width: 760px; text-align: center; }
    .accent {
      width: 44px;
      height: 4px;
      margin: 0 auto 32px;
      border-radius: 4px;
      background: #b8d9ae;
    }
    h1 {
      margin: 0;
      font-size: clamp(2.3rem, 7vw, 4rem);
      font-weight: 750;
      line-height: 1.1;
      letter-spacing: -0.045em;
      text-wrap: balance;
    }
    h2 {
      margin: 24px 0 20px;
      color: #b8d9ae;
      font-size: clamp(1.2rem, 4vw, 1.6rem);
      font-weight: 500;
      line-height: 1.4;
    }
    .description {
      max-width: 530px;
      margin: 0 auto;
      color: #bdc8d9;
      font-size: 1.05rem;
      line-height: 1.75;
      text-wrap: pretty;
    }
    footer { margin-top: 36px; }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 12px 22px;
      border: 1px solid #53677f;
      border-radius: 10px;
      color: #f5f7fc;
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
      background: #1c293b;
    }
    a:hover { background: #2a3b51; border-color: #b8d9ae; }
    a:focus-visible { outline: 3px solid #b8d9ae; outline-offset: 5px; }
  </style>
</head>
<body>
  <main>
    <div class="accent" aria-hidden="true"></div>
    <h1>The Little Dynasty Games</h1>
    <h2>Next Brainrot: Evolution</h2>
    <p class="description">Independent mobile games built around discovery and progression.
      Merge, evolve and collect characters in Next Brainrot: Evolution.</p>
    <footer>
      <a href="https://kisskiraly79.github.io/next-brainrot-legal/">Privacy Policy</a>
    </footer>
  </main>
</body>
</html>
